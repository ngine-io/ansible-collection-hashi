ancestor: null
releases:
  1.8.0:
    modules:
    - description: Gather information about a Nomad agent.
      name: nomad_agent_info
      namespace: ''
    - description: Submit and remove Nomad jobs.
      name: nomad_job
      namespace: ''
    - description: Manage scheduling eligibility and drain of a Nomad client node.
      name: nomad_node
      namespace: ''
    - description: Gather information about the Nomad Raft peer set.
      name: nomad_raft_info
      namespace: ''
    release_date: '2026-09-07'
  1.9.0:
    changes:
      minor_changes:
      - nomad, consul - ``nomad__extra_config``, ``consul__extra_config``, ``consul__services``,
        ``consul__checks`` and ``consul__watches`` set to ``null`` (e.g. left empty
        in inventory) are treated as empty.
      - nomad, consul, common, cni, nomad_upgrade - read facts through the ``ansible_facts``
        namespace instead of injected ``ansible_*`` variables, and use explicit boolean
        conditionals as required by ansible-core 2.19+.
    fragments:
    - ansible-core-2.19-conditionals.yml
    release_date: '2026-11-24'
