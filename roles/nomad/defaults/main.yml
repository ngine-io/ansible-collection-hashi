---
nomad__package: "nomad"
# Pin to an exact package version, e.g. "1.8.4-1". Null tracks the repository.
nomad__version: null
# Additional packages the agent needs, e.g. git for the git artifact getter.
nomad__extra_packages:
  - git

# Ownership and permissions of the rendered configuration. The config may hold
# the gossip key and ACL tokens, so it is not world readable by default.
nomad__config_owner: root
nomad__config_group: root
nomad__config_file_mode: "0640"
nomad__config_dir_mode: "0700"

# Run "nomad config validate" before any restart is triggered.
nomad__config_validate: true
nomad__node_name: "{{ inventory_hostname_short }}"
nomad__log_level: INFO
nomad__data_path: /opt/nomad/data
nomad__roles:
  - client
  - server

nomad__bind_address: "0.0.0.0"
nomad__advertise_address: "{{ ansible_default_ipv4.address }}"

nomad__node_class: ""

nomad__datacenter: "{{ hashi_common__datacenter }}"
nomad__region: "global"

nomad__port_http: 4646
nomad__port_rpc: 4647
nomad__port_serf: 4648

# Addresses the agent binds to per interface. Null falls back to
# nomad__bind_address.
nomad__address_http: null
nomad__address_rpc: null
nomad__address_serf: null

# Addresses advertised to peers per interface. Useful when the agent sits
# behind NAT or on a host with a separate management network.
nomad__advertise_http: "{{ nomad__advertise_address }}"
nomad__advertise_rpc: "{{ nomad__advertise_address }}"
nomad__advertise_serf: "{{ nomad__advertise_address }}"

# Logging
nomad__log_json: false
nomad__log_file: null
nomad__log_rotate_bytes: null
nomad__log_rotate_duration: null
nomad__log_rotate_max_files: null
nomad__enable_syslog: false
nomad__syslog_facility: null

# Agent behaviour
nomad__plugin_dir: null
nomad__enable_debug: false
# Nomad defaults this to false. Config managed clusters have no use for the
# checkpoint call home, so the role opts out.
nomad__disable_update_check: true
nomad__disable_anonymous_signature: true
nomad__leave_on_interrupt: false
nomad__leave_on_terminate: false

# Web UI, see https://developer.hashicorp.com/nomad/docs/configuration/ui
nomad__ui_enabled: true
nomad__ui_consul_url: null
nomad__ui_vault_url: null
nomad__ui_label_text: null
nomad__ui_label_background_color: null
nomad__ui_label_text_color: null

# Agent limits, see
# https://developer.hashicorp.com/nomad/docs/configuration#limits-parameters
nomad__limits_http_max_conns_per_client: null
nomad__limits_https_handshake_timeout: null
nomad__limits_rpc_handshake_timeout: null
nomad__limits_rpc_max_conns_per_client: null

# Extra headers returned by the HTTP API, e.g. CORS headers.
nomad__http_api_response_headers: {}

# TLS, see https://developer.hashicorp.com/nomad/docs/configuration/tls
# Certificates are expected to already be on the host. Alternatively set the
# *_content variables below and the role writes them out.
nomad__tls_enabled: false
nomad__tls_http: true
nomad__tls_rpc: true
nomad__tls_path: "{{ nomad__config_path }}/tls"
nomad__tls_ca_file: "{{ nomad__tls_path }}/ca.pem"
nomad__tls_cert_file: "{{ nomad__tls_path }}/agent.pem"
nomad__tls_key_file: "{{ nomad__tls_path }}/agent-key.pem"
nomad__tls_verify_server_hostname: true
nomad__tls_verify_https_client: false
# Set to true for the first pass of a rolling TLS rollout so servers still
# accept plaintext RPC from not yet converted peers, then set it back.
nomad__tls_rpc_upgrade_mode: false
nomad__tls_min_version: null
nomad__tls_cipher_suites: []

# Optional certificate material. When set, the role writes it to the
# corresponding *_file path.
nomad__tls_ca_content: null
nomad__tls_cert_content: null
nomad__tls_key_content: null

# Telemetry, see https://developer.hashicorp.com/nomad/docs/configuration/telemetry
nomad__telemetry_collection_interval: 60s
nomad__telemetry_disable_hostname: true
nomad__telemetry_use_node_name: false
nomad__telemetry_publish_allocation_metrics: true
nomad__telemetry_publish_node_metrics: true
nomad__telemetry_disable_dispatched_job_summary_metrics: false
nomad__telemetry_include_alloc_metadata_in_metrics: false
nomad__telemetry_filter_default: true
nomad__telemetry_prefix_filter: []
nomad__telemetry_in_memory_collection_interval: null
nomad__telemetry_in_memory_retention_period: null

# Sinks. The Prometheus endpoint on /v1/metrics is on by default, the push
# based sinks stay off until an address is configured.
nomad__telemetry_prometheus_metrics: true
nomad__telemetry_statsite_address: null
nomad__telemetry_statsd_address: null
nomad__telemetry_datadog_address: null
nomad__telemetry_datadog_tags: []

# Ansible Inventory Nomad Group Name of Servers
nomad__server_group_name: nomad_servers

# See https://www.nomadproject.io/docs/configuration/server#configuring-scheduler-config for limitations
nomad__server_scheduler_scheduler_algorithm: "binpack"
nomad__server_scheduler_memory_oversubscription_enabled: false
nomad__server_scheduler_reject_job_registration: false
nomad__server_scheduler_preemp_batch_scheduler_enabled: false
nomad__server_scheduler_preemp_system_scheduler_enabled: true
nomad__server_scheduler_preemp_service_scheduler_enabled: false
nomad__server_scheduler_preemp_sysbatch_scheduler_enabled: false

nomad__servers: |
  {% set _nomad_servers = [] %}
  {% for host in groups[nomad__server_group_name] %}
  {% if _nomad_servers.append(hostvars[host]['nomad__advertise_address'] | default(hostvars[host]['ansible_default_ipv4']['address'], true)) %}{% endif %}
  {% endfor %}
  {{ _nomad_servers }}

nomad__use_consul: false

nomad__client_meta: {}
nomad__client_network_interface: null

# Reserved resources
nomad__client_reserved_cpu: 200
nomad__client_reserved_memory: 256
nomad__client_reserved_disk: 1024
nomad__client_reserved_ports:
  - "22"
  - "8500-8600"

nomad__client_cpu_total_compute: null

# Host volumes
nomad__client_host_volume_basepath: "/mnt"
nomad__client_host_volumes: []
#  - name: mysql
#    path: /mysql

# Host networks
nomad__client_host_networks: []
  # - name: public
  #   cidr: "203.0.113.0/24"

## Plugins configs
# docker
nomad__client_plugin_docker_allow_privileged: false
nomad__client_plugin_docker_volume_enabled: false
# raw_exec
nomad__client_plugin_raw_exec_enabled: false
