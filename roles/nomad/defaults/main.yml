---
nomad__package: "nomad"
# Pin to an exact package version, e.g. "1.8.4-1". Null tracks the repository.
nomad__version: null
# Additional packages the agent needs, e.g. git for the git artifact getter.
nomad__extra_packages:
  - git

# Ownership and permissions of the rendered configuration. The config may hold
# the gossip key and ACL tokens, so it is not world readable by default.
nomad__config_owner: root
nomad__config_group: root
nomad__config_file_mode: "0640"
nomad__config_dir_mode: "0700"

# Run "nomad config validate" before any restart is triggered.
nomad__config_validate: true
nomad__node_name: "{{ inventory_hostname_short }}"
nomad__log_level: INFO
nomad__data_path: /opt/nomad/data
nomad__roles:
  - client
  - server

nomad__bind_address: "0.0.0.0"
nomad__advertise_address: "{{ ansible_default_ipv4.address }}"

nomad__node_class: ""

nomad__datacenter: "{{ hashi_common__datacenter }}"
nomad__region: "global"

nomad__port_http: 4646
nomad__port_rpc: 4647
nomad__port_serf: 4648

# Addresses the agent binds to per interface. Null falls back to
# nomad__bind_address.
nomad__address_http: null
nomad__address_rpc: null
nomad__address_serf: null

# Addresses advertised to peers per interface. Useful when the agent sits
# behind NAT or on a host with a separate management network.
nomad__advertise_http: "{{ nomad__advertise_address }}"
nomad__advertise_rpc: "{{ nomad__advertise_address }}"
nomad__advertise_serf: "{{ nomad__advertise_address }}"

# Logging
nomad__log_json: false
nomad__log_file: null
nomad__log_rotate_bytes: null
nomad__log_rotate_duration: null
nomad__log_rotate_max_files: null
nomad__enable_syslog: false
nomad__syslog_facility: null

# Agent behaviour
nomad__plugin_dir: null
nomad__enable_debug: false
# Nomad defaults this to false. Config managed clusters have no use for the
# checkpoint call home, so the role opts out.
nomad__disable_update_check: true
nomad__disable_anonymous_signature: true
nomad__leave_on_interrupt: false
nomad__leave_on_terminate: false

# Web UI, see https://developer.hashicorp.com/nomad/docs/configuration/ui
nomad__ui_enabled: true
nomad__ui_consul_url: null
nomad__ui_vault_url: null
nomad__ui_label_text: null
nomad__ui_label_background_color: null
nomad__ui_label_text_color: null

# Agent limits, see
# https://developer.hashicorp.com/nomad/docs/configuration#limits-parameters
nomad__limits_http_max_conns_per_client: null
nomad__limits_https_handshake_timeout: null
nomad__limits_rpc_handshake_timeout: null
nomad__limits_rpc_max_conns_per_client: null

# Extra headers returned by the HTTP API, e.g. CORS headers.
nomad__http_api_response_headers: {}

# Vault integration, see
# https://developer.hashicorp.com/nomad/docs/configuration/vault
nomad__use_vault: false
nomad__vault_address: "https://127.0.0.1:8200"
nomad__vault_namespace: null
# Legacy token based integration. Prefer workload identity via
# nomad__vault_jwt_auth_backend_path and nomad__vault_default_identity_*.
nomad__vault_token: null
nomad__vault_create_from_role: null
nomad__vault_task_token_ttl: null
nomad__vault_allow_unauthenticated: true
nomad__vault_jwt_auth_backend_path: null
nomad__vault_default_identity_aud: []
nomad__vault_default_identity_ttl: null
nomad__vault_default_identity_env: true
nomad__vault_default_identity_file: false
nomad__vault_ca_file: null
nomad__vault_ca_path: null
nomad__vault_cert_file: null
nomad__vault_key_file: null
nomad__vault_tls_server_name: null
nomad__vault_tls_skip_verify: false

# ACLs, see https://developer.hashicorp.com/nomad/docs/configuration/acl
# Enabling this only turns on enforcement. Bootstrapping the initial
# management token and writing policies stays a deliberate manual step.
nomad__acl_enabled: false
nomad__acl_token_ttl: null
nomad__acl_policy_ttl: null
nomad__acl_role_ttl: null
nomad__acl_token_min_expiration_ttl: null
nomad__acl_token_max_expiration_ttl: null
# Secret. Only needed on servers in a multi region federation.
nomad__acl_replication_token: null

# TLS, see https://developer.hashicorp.com/nomad/docs/configuration/tls
# Certificates are expected to already be on the host. Alternatively set the
# *_content variables below and the role writes them out.
nomad__tls_enabled: false
nomad__tls_http: true
nomad__tls_rpc: true
nomad__tls_path: "{{ nomad__config_path }}/tls"
nomad__tls_ca_file: "{{ nomad__tls_path }}/ca.pem"
nomad__tls_cert_file: "{{ nomad__tls_path }}/agent.pem"
nomad__tls_key_file: "{{ nomad__tls_path }}/agent-key.pem"
nomad__tls_verify_server_hostname: true
nomad__tls_verify_https_client: false
# Set to true for the first pass of a rolling TLS rollout so servers still
# accept plaintext RPC from not yet converted peers, then set it back.
nomad__tls_rpc_upgrade_mode: false
nomad__tls_min_version: null
nomad__tls_cipher_suites: []

# Optional certificate material. When set, the role writes it to the
# corresponding *_file path.
nomad__tls_ca_content: null
nomad__tls_cert_content: null
nomad__tls_key_content: null

# Telemetry, see https://developer.hashicorp.com/nomad/docs/configuration/telemetry
nomad__telemetry_collection_interval: 60s
nomad__telemetry_disable_hostname: true
nomad__telemetry_use_node_name: false
nomad__telemetry_publish_allocation_metrics: true
nomad__telemetry_publish_node_metrics: true
nomad__telemetry_disable_dispatched_job_summary_metrics: false
nomad__telemetry_include_alloc_metadata_in_metrics: false
nomad__telemetry_filter_default: true
nomad__telemetry_prefix_filter: []
nomad__telemetry_in_memory_collection_interval: null
nomad__telemetry_in_memory_retention_period: null

# Sinks. The Prometheus endpoint on /v1/metrics is on by default, the push
# based sinks stay off until an address is configured.
nomad__telemetry_prometheus_metrics: true
nomad__telemetry_statsite_address: null
nomad__telemetry_statsd_address: null
nomad__telemetry_datadog_address: null
nomad__telemetry_datadog_tags: []

# Ansible Inventory Nomad Group Name of Servers
nomad__server_group_name: nomad_servers

# Number of servers expected before the cluster bootstraps. Derived from the
# inventory group; override when growing a cluster in place.
nomad__server_bootstrap_expect: "{{ nomad__servers | count }}"

# Gossip encryption key, "nomad operator gossip keyring generate". Servers
# without a matching key cannot join each other.
nomad__server_encrypt: null

nomad__server_authoritative_region: null
nomad__server_enabled_schedulers: []
nomad__server_num_schedulers: null
nomad__server_raft_protocol: null
# Multiplier on the Raft timeouts. 1 is the tight, low latency setting, 5 the
# relaxed one for cloud or cross-AZ networks.
nomad__server_raft_multiplier: null
nomad__server_non_voting_server: false
nomad__server_redundancy_zone: null
nomad__server_upgrade_version: null
nomad__server_license_path: null
nomad__server_rejoin_after_leave: false
nomad__server_oidc_issuer: null
nomad__server_job_max_priority: null
nomad__server_job_default_priority: null
nomad__server_enable_event_broker: true
nomad__server_event_buffer_size: null

# How servers find each other. Defaults to the inventory derived list unless
# Consul is used for discovery.
nomad__server_retry_join: "{{ [] if nomad__use_consul else nomad__servers }}"
nomad__server_retry_interval: null
nomad__server_retry_max: null
nomad__server_start_join: []

# Garbage collection
nomad__server_job_gc_interval: null
nomad__server_job_gc_threshold: null
nomad__server_eval_gc_threshold: null
nomad__server_node_gc_threshold: null
nomad__server_deployment_gc_threshold: null
nomad__server_csi_volume_claim_gc_threshold: null
nomad__server_csi_plugin_gc_threshold: null
nomad__server_acl_token_gc_threshold: null

# Heartbeats. Raising the grace period avoids mass reschedules when a network
# blip makes many clients miss a heartbeat at once.
nomad__server_heartbeat_grace: null
nomad__server_min_heartbeat_ttl: null
nomad__server_failover_heartbeat_ttl: null
nomad__server_max_heartbeats_per_second: null

# Plan rejection tracker, marks a client ineligible after repeated rejections.
nomad__server_plan_rejection_tracker_enabled: false
nomad__server_plan_rejection_tracker_node_threshold: null
nomad__server_plan_rejection_tracker_node_window: null

# Autopilot, see
# https://developer.hashicorp.com/nomad/docs/configuration/autopilot
nomad__autopilot_cleanup_dead_servers: true
nomad__autopilot_last_contact_threshold: null
nomad__autopilot_max_trailing_logs: null
nomad__autopilot_min_quorum: null
nomad__autopilot_server_stabilization_time: null
nomad__autopilot_enable_redundancy_zones: false
nomad__autopilot_disable_upgrade_migration: false
nomad__autopilot_enable_custom_upgrades: false

# See https://www.nomadproject.io/docs/configuration/server#configuring-scheduler-config for limitations
nomad__server_scheduler_scheduler_algorithm: "binpack"
nomad__server_scheduler_memory_oversubscription_enabled: false
nomad__server_scheduler_reject_job_registration: false
nomad__server_scheduler_preemp_batch_scheduler_enabled: false
nomad__server_scheduler_preemp_system_scheduler_enabled: true
nomad__server_scheduler_preemp_service_scheduler_enabled: false
nomad__server_scheduler_preemp_sysbatch_scheduler_enabled: false

nomad__servers: |
  {% set _nomad_servers = [] %}
  {% for host in groups[nomad__server_group_name] %}
  {% if _nomad_servers.append(hostvars[host]['nomad__advertise_address'] | default(hostvars[host]['ansible_default_ipv4']['address'], true)) %}{% endif %}
  {% endfor %}
  {{ _nomad_servers }}

# Consul integration, see
# https://developer.hashicorp.com/nomad/docs/configuration/consul
# nomad__use_consul also makes the systemd unit order after consul.service and
# lets clients discover servers instead of using a static server list.
nomad__use_consul: false
nomad__consul_address: "127.0.0.1:8500"
nomad__consul_grpc_address: null
nomad__consul_namespace: null
nomad__consul_token: null
nomad__consul_auth: null
nomad__consul_auto_advertise: true
nomad__consul_server_auto_join: true
nomad__consul_client_auto_join: true
nomad__consul_server_service_name: nomad
nomad__consul_client_service_name: nomad-client
nomad__consul_server_http_check_name: null
nomad__consul_server_serf_check_name: null
nomad__consul_server_rpc_check_name: null
nomad__consul_client_http_check_name: null
nomad__consul_checks_use_advertise: false
nomad__consul_tags: []
nomad__consul_timeout: null
# Set to false once every client runs a version that supports workload
# identity based Consul auth.
nomad__consul_allow_unauthenticated: true
nomad__consul_service_auth_method: null
nomad__consul_task_auth_method: null

# TLS towards the Consul API
nomad__consul_ssl: false
nomad__consul_verify_ssl: true
nomad__consul_share_ssl: null
nomad__consul_ca_file: null
nomad__consul_cert_file: null
nomad__consul_key_file: null

nomad__client_meta: {}
nomad__client_network_interface: null

# Reserved resources
nomad__client_reserved_cpu: 200
nomad__client_reserved_memory: 256
nomad__client_reserved_disk: 1024
nomad__client_reserved_ports:
  - "22"
  - "8500-8600"

nomad__client_cpu_total_compute: null

# Host volumes
nomad__client_host_volume_basepath: "/mnt"
nomad__client_host_volumes: []
#  - name: mysql
#    path: /mysql

# Host networks
nomad__client_host_networks: []
  # - name: public
  #   cidr: "203.0.113.0/24"

## Plugins configs
# docker
nomad__client_plugin_docker_allow_privileged: false
nomad__client_plugin_docker_volume_enabled: false
# raw_exec
nomad__client_plugin_raw_exec_enabled: false
