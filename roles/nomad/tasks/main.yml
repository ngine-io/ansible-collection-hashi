---
- name: Install
  ansible.builtin.package:
    name: "{{ [nomad__package_spec] + nomad__extra_packages }}"
  notify:
    - Restart nomad

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ nomad__config_path }}"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_dir_mode }}"
    state: directory

- name: Setup nomad.env
  ansible.builtin.copy:
    content: |
      {% for key, value in nomad__environment.items() %}
      {{ key }}={{ value }}
      {% endfor %}
      {{ nomad__env_content }}
    dest: "{{ nomad__config_path }}/nomad.env"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_file_mode }}"
  notify:
    - Restart nomad

- name: Configure unit file for systemd
  ansible.builtin.template:
    src: nomad_systemd.service.j2
    dest: /etc/systemd/system/nomad.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart nomad

# The net.bridge.* sysctls only exist once br_netfilter is loaded, which is
# why setting them used to be wrapped in ignore_errors.
- name: Load the br_netfilter kernel module
  ansible.builtin.command: modprobe br_netfilter
  args:
    creates: /proc/sys/net/bridge
  when: "'client' in nomad__roles"

- name: Load the br_netfilter kernel module on boot
  ansible.builtin.copy:
    content: "br_netfilter\n"
    dest: /etc/modules-load.d/nomad-bridge.conf
    owner: root
    group: root
    mode: "0644"
  when: "'client' in nomad__roles"

- name: Configure sysctl for bridge networking
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: "{{ nomad__sysctl_file }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ nomad__sysctl_bridge }}"
  when: "'client' in nomad__roles"

- name: Ensure TLS directory exists
  ansible.builtin.file:
    path: "{{ nomad__tls_path }}"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_dir_mode }}"
    state: directory
  when: nomad__tls_enabled | bool

- name: Configure TLS material
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ item.mode }}"
  loop:
    - content: "{{ nomad__tls_ca_content }}"
      dest: "{{ nomad__tls_ca_file }}"
      mode: "0644"
    - content: "{{ nomad__tls_cert_content }}"
      dest: "{{ nomad__tls_cert_file }}"
      mode: "0644"
    - content: "{{ nomad__tls_key_content }}"
      dest: "{{ nomad__tls_key_file }}"
      mode: "0600"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - nomad__tls_enabled | bool
    - item.content is not none
  no_log: true
  notify:
    - Restart nomad

- name: Configure base config
  ansible.builtin.template:
    src: nomad.hcl.j2
    dest: "{{ nomad__config_path }}/nomad.hcl"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_file_mode }}"
  notify:
    - Restart nomad

- name: Configure server
  ansible.builtin.template:
    src: server.hcl.j2
    dest: "{{ nomad__config_path }}/server.hcl"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_file_mode }}"
  when: "'server' in nomad__roles"
  notify:
    - Restart nomad

- name: Remove server config
  ansible.builtin.file:
    path: "{{ nomad__config_path }}/server.hcl"
    state: absent
  when: "'server' not in nomad__roles"
  notify:
    - Restart nomad

- name: Create host volumes
  ansible.builtin.file:
    path: "{{ nomad__client_host_volume_basepath + item.path }}"
    mode: "0777"
    state: directory
  loop: "{{ nomad__client_host_volumes }}"

- name: Configure client
  ansible.builtin.template:
    src: client.hcl.j2
    dest: "{{ nomad__config_path }}/client.hcl"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_file_mode }}"
  when: "'client' in nomad__roles"
  notify:
    - Restart nomad

- name: Remove client config
  ansible.builtin.file:
    path: "{{ nomad__config_path }}/client.hcl"
    state: absent
  when: "'client' not in nomad__roles"
  notify:
    - Restart nomad

# Nomad merges every .hcl and .json file in the config directory. The zz-
# prefix keeps these last so they win over what the role renders.
- name: Configure extra config
  ansible.builtin.copy:
    content: "{{ nomad__extra_config | to_nice_json(indent=2) }}\n"
    dest: "{{ nomad__config_path }}/zz-extra.json"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_file_mode }}"
  when: nomad__extra_config
  notify:
    - Restart nomad

- name: Remove extra config
  ansible.builtin.file:
    path: "{{ nomad__config_path }}/zz-extra.json"
    state: absent
  when: not nomad__extra_config
  notify:
    - Restart nomad

- name: Configure extra config files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ nomad__config_path }}/{{ item.key }}"
    owner: "{{ nomad__config_owner }}"
    group: "{{ nomad__config_group }}"
    mode: "{{ nomad__config_file_mode }}"
  loop: "{{ nomad__extra_config_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify:
    - Restart nomad

- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ nomad__data_path }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

# Runs before the handlers so a broken configuration fails the play instead of
# restarting the agent into a crash loop.
- name: Validate config
  ansible.builtin.command: nomad config validate "{{ nomad__config_path }}"
  changed_when: false
  when:
    - nomad__config_validate | bool
    - not ansible_check_mode

- name: Ensure service is running
  ansible.builtin.systemd:
    name: nomad
    state: started
    enabled: true
    daemon_reload: true

- name: Run handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for http port
  ansible.builtin.wait_for:
    port: "{{ nomad__port_http }}"
  when: not ansible_check_mode
