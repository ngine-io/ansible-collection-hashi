---
- name: Install
  package:
    name: "{{ consul__package_spec }}"
  notify:
    - restart consul

- name: Ensure config directory exists
  file:
    path: "{{ consul__config_path }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_dir_mode }}"
    state: directory

- name: Ensure data directory exists
  file:
    path: "{{ consul__data_dir }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: 0700
    state: directory

- name: Ensure TLS directory exists
  file:
    path: "{{ consul__tls_path }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_dir_mode }}"
    state: directory
  when: consul__tls_enabled | bool

- name: Configure TLS material
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ item.mode }}"
  loop:
    - content: "{{ consul__tls_ca_content }}"
      dest: "{{ consul__tls_ca_file }}"
      mode: "0644"
    - content: "{{ consul__tls_cert_content }}"
      dest: "{{ consul__tls_cert_file }}"
      mode: "0644"
    - content: "{{ consul__tls_key_content }}"
      dest: "{{ consul__tls_key_file }}"
      mode: "0600"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - consul__tls_enabled | bool
    - item.content is not none
  no_log: true
  notify: restart consul

- name: Ensure systemd drop-in directory exists
  file:
    path: /etc/systemd/system/consul.service.d
    owner: root
    group: root
    mode: 0755
    state: directory

- name: Configure systemd drop-in
  template:
    src: consul_systemd_override.conf.j2
    dest: /etc/systemd/system/consul.service.d/override.conf
    owner: root
    group: root
    mode: 0644
  notify: restart consul

- name: Setup consul.env
  copy:
    content: |
      {% for key, value in consul__environment.items() %}
      {{ key }}={{ value }}
      {% endfor %}
      {{ consul__env_content }}
    dest: "{{ consul__config_path }}/consul.env"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  notify: restart consul

- name: Configure
  template:
    src: consul.hcl.j2
    dest: "{{ consul__config_path }}/consul.hcl"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  notify: restart consul

# Consul merges every .hcl and .json file in the config directory. The zz-
# prefix keeps these last so they win over what the role renders.
- name: Configure services, checks and watches
  copy:
    content: "{{ {'services': consul__services, 'checks': consul__checks, 'watches': consul__watches} | to_nice_json(indent=2) }}\n"
    dest: "{{ consul__config_path }}/zz-services.json"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  when: consul__services or consul__checks or consul__watches
  notify: restart consul

- name: Remove services, checks and watches
  file:
    path: "{{ consul__config_path }}/zz-services.json"
    state: absent
  when: not (consul__services or consul__checks or consul__watches)
  notify: restart consul

- name: Configure extra config
  copy:
    content: "{{ consul__extra_config | to_nice_json(indent=2) }}\n"
    dest: "{{ consul__config_path }}/zz-extra.json"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  when: consul__extra_config
  notify: restart consul

- name: Remove extra config
  file:
    path: "{{ consul__config_path }}/zz-extra.json"
    state: absent
  when: not consul__extra_config
  notify: restart consul

- name: Configure extra config files
  copy:
    content: "{{ item.value }}"
    dest: "{{ consul__config_path }}/{{ item.key }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  loop: "{{ consul__extra_config_files | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: restart consul

- name: Validate consul config
  command: consul validate "{{ consul__config_path }}/"
  changed_when: false
  when:
    - consul__config_validate | bool
    - not ansible_check_mode

- name: Ensure service is running
  systemd:
    name: consul
    state: started
    enabled: true
    daemon_reload: true

- name: Run handlers
  meta: flush_handlers
