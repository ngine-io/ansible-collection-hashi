---
- name: Install
  package:
    name: "{{ consul__package_spec }}"
  notify:
    - restart consul

- name: Ensure config directory exists
  file:
    path: "{{ consul__config_path }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_dir_mode }}"
    state: directory

- name: Ensure data directory exists
  file:
    path: "{{ consul__data_dir }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: 0700
    state: directory

- name: Ensure TLS directory exists
  file:
    path: "{{ consul__tls_path }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_dir_mode }}"
    state: directory
  when: consul__tls_enabled | bool

- name: Configure TLS material
  copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ item.mode }}"
  loop:
    - content: "{{ consul__tls_ca_content }}"
      dest: "{{ consul__tls_ca_file }}"
      mode: "0644"
    - content: "{{ consul__tls_cert_content }}"
      dest: "{{ consul__tls_cert_file }}"
      mode: "0644"
    - content: "{{ consul__tls_key_content }}"
      dest: "{{ consul__tls_key_file }}"
      mode: "0600"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - consul__tls_enabled | bool
    - item.content is not none
  no_log: true
  notify: restart consul

- name: Setup consul.env
  copy:
    content: "{{ consul__env_content }}"
    dest: "{{ consul__config_path }}/consul.env"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  notify: restart consul

- name: Configure
  template:
    src: consul.hcl.j2
    dest: "{{ consul__config_path }}/consul.hcl"
    owner: "{{ consul__config_owner }}"
    group: "{{ consul__config_group }}"
    mode: "{{ consul__config_file_mode }}"
  notify: restart consul

- name: Validate consul config
  command: consul validate "{{ consul__config_path }}/"
  changed_when: false
  when:
    - consul__config_validate | bool
    - not ansible_check_mode

- name: Ensure service is running
  systemd:
    name: consul
    state: started
    enabled: true

- name: Run handlers
  meta: flush_handlers
