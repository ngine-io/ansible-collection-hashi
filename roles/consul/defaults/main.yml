---
consul__package: "consul"
# Pin to an exact package version, e.g. "1.19.2-1". Null tracks the repository.
consul__version: null

# The packaged unit runs the agent as the consul user, so the config has to be
# readable by it. It holds the gossip key and ACL tokens, hence 0640.
consul__config_owner: consul
consul__config_group: consul
consul__config_file_mode: "0640"
consul__config_dir_mode: "0750"

consul__config_validate: true
consul__datacenter: "{{ hashi_common__datacenter }}"
consul__domain: consul
consul__role: server

consul__node_name: "{{ inventory_hostname_short }}"
consul__log_level: INFO
consul__bind_address: "0.0.0.0"
consul__advertise_address: "{{ ansible_default_ipv4.address }}"
consul__client_addresses:
  - "0.0.0.0"

# See https://www.consul.io/docs/agent/options#ports
consul__port_grpc: 8502
consul__port_dns: 8600
consul__port_http: 8500
consul__port_https: 8501
consul__port_serf_lan: 8301
consul__port_serf_wan: 8302
consul__port_server: 8300
consul__port_sidecar_min: 21000
consul__port_sidecar_max: 21255
consul__port_expose_min: 21500
consul__port_expose_max: 21755

consul__recursors: []
# - "1.1.1.1"
# - "1.0.0.1"

# Addresses the API and DNS endpoints bind to. Null falls back to
# consul__client_addresses.
consul__address_dns: null
consul__address_http: null
consul__address_https: null
consul__address_grpc: null
consul__address_grpc_tls: null

consul__advertise_address_wan: null
consul__translate_wan_addrs: false

# WAN federation
consul__primary_datacenter: null
consul__retry_join_wan: []
consul__retry_interval_wan: null
consul__retry_max_wan: null

# LAN join. Defaults to the inventory derived server list.
consul__retry_join: "{{ consul__servers }}"
consul__retry_interval: null
consul__retry_max: null

consul__alt_domain: null
consul__node_meta: {}

# Logging
consul__log_json: false
consul__log_file: null
consul__log_rotate_bytes: null
consul__log_rotate_duration: null
consul__log_rotate_max_files: null
consul__enable_syslog: false
consul__syslog_facility: null

# Agent behaviour
consul__enable_debug: false
consul__disable_update_check: true
consul__disable_anonymous_signature: true
consul__disable_host_node_id: false
# Leaving on terminate is right for clients, wrong for servers: a server that
# leaves gracefully is removed from the Raft peer set on every restart.
consul__leave_on_terminate: "{{ consul__role != 'server' }}"
consul__skip_leave_on_interrupt: "{{ consul__role == 'server' }}"
consul__rejoin_after_leave: false
consul__check_update_interval: null
consul__session_ttl_min: null
# Script checks let anyone with API write run commands on the agent host.
# Local only means checks must come from the agent's own config.
consul__enable_script_checks: false
consul__enable_local_script_checks: false

# DNS, see https://developer.hashicorp.com/consul/docs/agent/config/config-files#dns_config
consul__dns_allow_stale: true
consul__dns_max_stale: null
consul__dns_node_ttl: null
consul__dns_service_ttl: {}
consul__dns_enable_truncate: false
consul__dns_only_passing: false
consul__dns_udp_answer_limit: null
consul__dns_a_record_limit: null
consul__dns_recursor_strategy: null
consul__dns_use_cache: false
consul__dns_cache_max_age: null

# Performance, see
# https://developer.hashicorp.com/consul/docs/agent/config/config-files#performance
# raft_multiplier 1 is the tight setting, 5 the relaxed one for cloud
# networks. Consul's own default is 5.
consul__performance_raft_multiplier: null
consul__performance_leave_drain_time: null
consul__performance_rpc_hold_timeout: null

# Limits
consul__limits_http_max_conns_per_client: null
consul__limits_https_handshake_timeout: null
consul__limits_rpc_handshake_timeout: null
consul__limits_rpc_max_conns_per_client: null
consul__limits_rpc_rate: null
consul__limits_rpc_max_burst: null
consul__limits_kv_max_value_size: null
consul__limits_txn_max_req_len: null

# UI, see
# https://developer.hashicorp.com/consul/docs/agent/config/config-files#ui_config
consul__ui_content_path: null
consul__ui_metrics_provider: null
consul__ui_metrics_proxy_base_url: null
consul__ui_dashboard_url_templates: {}

consul__ui: true
consul__connect_enabled: false
consul__group_name: consul

## Server only options
# Number of servers expected before the cluster bootstraps. Derived from the
# inventory; override when growing a cluster in place.
consul__bootstrap_expect: "{{ consul__servers | count }}"
# Single node bootstrap. Never enable this on more than one server.
consul__bootstrap: false
consul__raft_protocol: null
consul__raft_snapshot_threshold: null
consul__raft_snapshot_interval: null
consul__raft_trailing_logs: null
consul__read_replica: false
consul__license_path: null
consul__reconnect_timeout: null
consul__reconnect_timeout_wan: null

# Autopilot, see
# https://developer.hashicorp.com/consul/docs/agent/config/config-files#autopilot
consul__autopilot_cleanup_dead_servers: true
consul__autopilot_last_contact_threshold: null
consul__autopilot_max_trailing_logs: null
consul__autopilot_min_quorum: null
consul__autopilot_server_stabilization_time: null
consul__autopilot_redundancy_zone_tag: null
consul__autopilot_disable_upgrade_migration: false
consul__autopilot_upgrade_version_tag: null
consul__data_dir: /opt/consul
consul__encrypt: ""

consul__servers: |
  {% set _consul__servers = [] %}
  {% for host in groups[consul__group_name] %}
  {% set _consul_node_role = hostvars[host]['consul__role'] | default('server', true) %}
  {% if _consul_node_role == 'server' %}
  {% if _consul__servers.append(hostvars[host]['consul__advertise_address'] | default(hostvars[host]['ansible_default_ipv4']['address'], true)) %}{% endif %}
  {% endif %}
  {% endfor %}
  {{ _consul__servers }}

consul__env_content: ""
consul__prometheus_retention_time: 600s
