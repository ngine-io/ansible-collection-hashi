---
- name: Job block
  environment:
    NOMAD_ADDR: "{{ nomad_job__nomad_addr }}"
    NOMAD_NAMESPACE: "{{ item.namespace | default(nomad_job__nomad_namespace) }}"
    NOMAD_REGION: "{{ nomad_job__nomad_region | default('', true) }}"
    NOMAD_TOKEN: "{{ nomad_job__nomad_token | default('', true) }}"
    NOMAD_CACERT: "{{ nomad_job__nomad_cacert | default('', true) }}"
    NOMAD_CLIENT_CERT: "{{ nomad_job__nomad_client_cert | default('', true) }}"
    NOMAD_CLIENT_KEY: "{{ nomad_job__nomad_client_key | default('', true) }}"
  block:
    - name: Stop job
      ansible.builtin.command: >
        nomad job stop {{ '-purge' if item.purge | default(false) | bool else '' }} {{ item.name }}
      register: nomad_job__stop
      changed_when: "'not found' not in nomad_job__stop.stderr"
      failed_when:
        - nomad_job__stop.rc != 0
        - "'not found' not in nomad_job__stop.stderr"
      when: item.state | default('present') == 'absent'

    - name: Handle present job
      when: item.state | default('present') != 'absent'
      block:
        - name: Setup job
          ansible.builtin.template:
            src: "./nomad_jobs/{{ item.path }}.j2"
            dest: "{{ nomad_job__tmp_path }}/{{ item.path }}"
            owner: root
            group: root
            mode: "0600"
          vars:
            job_vars: "{{ nomad_job__vars | combine(item.vars | default({})) }}"
          check_mode: false
          changed_when: false

        - name: Validate job
          ansible.builtin.command: >
            nomad job validate {{ nomad_job__tmp_path }}/{{ item.path }}
          check_mode: false
          changed_when: false

        - name: Plan job
          ansible.builtin.command: >
            nomad job plan {{ nomad_job__tmp_path }}/{{ item.path }}
          register: nomad_job__plan
          changed_when: nomad_job__plan.rc | int == 1
          failed_when: nomad_job__plan.rc | int > 1
          check_mode: false

        - name: Show plan
          ansible.builtin.debug:
            var: nomad_job__plan.stdout_lines

        # Not a handler: the run has to happen inside this job's sequence,
        # before the next job in the loop is planned.
        - name: Run job  # noqa: no-handler
          ansible.builtin.command: >
            nomad job run {{ nomad_job__tmp_path }}/{{ item.path }}
          register: nomad_job__run
          changed_when: nomad_job__run.rc == 0
          when: nomad_job__plan is changed
