---
- name: Upgrade block
  environment:
    NOMAD_ADDR: "{{ nomad_upgrade__nomad_addr }}"
    NOMAD_TOKEN: "{{ nomad_upgrade__nomad_token | default('', true) }}"
    NOMAD_CACERT: "{{ nomad_upgrade__nomad_cacert | default('', true) }}"
    NOMAD_CLIENT_CERT: "{{ nomad_upgrade__nomad_client_cert | default('', true) }}"
    NOMAD_CLIENT_KEY: "{{ nomad_upgrade__nomad_client_key | default('', true) }}"
  block:
    - name: Update package cache for Debian
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_os_family == 'Debian'

    # package-latest is the entire point of this role: it exists to move a
    # host to the current packages under a controlled drain and reboot.
    - name: Check all packages to their latest version  # noqa: package-latest
      ansible.builtin.package:
        name: "{{ nomad_upgrade__package_name }}"
        state: latest
      check_mode: true
      register: nomad_upgrade__updates_available

    - name: Ensure Nomad eligibility enabled if unchanged
      when:
        - nomad_upgrade__updates_available is not changed
        - nomad_upgrade__is_client | bool
      ansible.builtin.command: nomad node eligibility -self -enable
      register: nomad_upgrade__eligibility
      until: nomad_upgrade__eligibility.rc == 0
      retries: "{{ nomad_upgrade__retries }}"
      delay: "{{ nomad_upgrade__delay }}"
      changed_when: false

    # Not a handler: the drain, upgrade and reboot have to run in order
    # within this host's turn of the serial play.
    - name: Process package updates  # noqa: no-handler
      when: nomad_upgrade__updates_available is changed
      block:
        - name: Nomad drain node
          ansible.builtin.command: >
            nomad node drain -self -enable
            -deadline {{ nomad_upgrade__drain_deadline }}
            -ignore-system={{ nomad_upgrade__drain_ignore_system_jobs | bool | lower }}
          register: nomad_upgrade__drain
          changed_when: nomad_upgrade__drain.rc == 0
          until: nomad_upgrade__drain.rc == 0
          retries: "{{ nomad_upgrade__retries }}"
          delay: "{{ nomad_upgrade__delay }}"
          when: nomad_upgrade__is_client | bool

        - name: Update all packages to their latest version  # noqa: package-latest
          ansible.builtin.package:
            name: "{{ nomad_upgrade__package_name }}"
            state: latest

        - name: Reboot host
          ansible.builtin.reboot:
            reboot_timeout: "{{ nomad_upgrade__reboot_timeout }}"
          when: nomad_upgrade__reboot | bool

        - name: Restart nomad
          ansible.builtin.systemd:
            name: nomad
            state: restarted
          when: not nomad_upgrade__reboot | bool

        - name: Wait for the agent to answer again
          ansible.builtin.command: nomad agent-info
          register: nomad_upgrade__agent_info
          until: nomad_upgrade__agent_info.rc == 0
          retries: "{{ nomad_upgrade__retries }}"
          delay: "{{ nomad_upgrade__delay }}"
          changed_when: false

        - name: Wait for the server to rejoin the raft peer set
          ansible.builtin.shell: >
            set -o pipefail &&
            nomad operator raft list-peers | grep -c -E '\b(leader|follower)\b'
          args:
            executable: /bin/bash
          register: nomad_upgrade__raft_peers
          until: nomad_upgrade__raft_peers.rc == 0 and nomad_upgrade__raft_peers.stdout | int >= (nomad__servers | default([]) | count)
          retries: "{{ nomad_upgrade__retries }}"
          delay: "{{ nomad_upgrade__delay }}"
          changed_when: false
          when: "'server' in (nomad__roles | default([]))"

        - name: Nomad eligibility enable node
          ansible.builtin.command: nomad node eligibility -self -enable
          register: nomad_upgrade__eligibility
          until: nomad_upgrade__eligibility.rc == 0
          retries: "{{ nomad_upgrade__retries }}"
          delay: "{{ nomad_upgrade__delay }}"
          changed_when: false
          when: nomad_upgrade__is_client | bool

        - name: Let the rescheduled allocations settle
          ansible.builtin.pause:
            seconds: "{{ nomad_upgrade__settle_seconds }}"
          when: nomad_upgrade__settle_seconds | int > 0
